name: Quick checks
# Single Linux runner; test only affected sources, not documentation.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Makefile'
      - 'projects.mk'
      - 'scripts/**'
      - 'tests/**'
      - 'instruments/**'
      - 'effects/**'
      - 'modules/**'
      - 'editors/**'
      - 'diagnostics/**'
      - 'common/**'
      - 'libDaisy'
      - 'DaisySP'
      - '!**/docs/**'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Makefile'
      - 'projects.mk'
      - 'scripts/**'
      - 'tests/**'
      - 'instruments/**'
      - 'effects/**'
      - 'modules/**'
      - 'editors/**'
      - 'diagnostics/**'
      - 'common/**'
      - 'libDaisy'
      - 'DaisySP'
      - '!**/docs/**'
      - '!**/*.md'
permissions:
  contents: read
concurrency:
  group: quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed components
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def exists(sha):
              return bool(sha) and sha.strip("0") != "" and subprocess.run(
                  ["git", "cat-file", "-e", sha + "^{commit}"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              ).returncode == 0

          base = os.environ.get("BASE_SHA", "")
          head = os.environ.get("HEAD_SHA", "")
          if exists(base) and exists(head):
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", base, head], text=True
              ).splitlines()
          elif exists(base):
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", base, "HEAD"], text=True
              ).splitlines()
          else:
              # If history is unavailable, run all suites rather than silently skip.
              changed = ["Makefile"]

          # common/sd/ has its own suite and is not used by any firmware yet.
          shared = any(p in ("Makefile", "projects.mk", "libDaisy", "DaisySP") or
                       (p.startswith("common/") and not p.startswith("common/sd/"))
                       for p in changed)
          def touched(*prefixes):
              return shared or any(p.startswith(prefixes) for p in changed)

          suites = {
              "toy": touched("instruments/toy-piano/"),
              "physical": touched("instruments/physical-modeling/"),
              "granular": touched("instruments/granular/"),
              "looper": touched("instruments/looper/"),
              "reverb": touched("effects/reverb/"),
              "mod": touched("modules/mod-on-daisy/"),
              "editor": touched("editors/mod-on-daisy/",
                                "modules/mod-on-daisy/include/"),
              "diagnostics": touched("diagnostics/"),
              "sd": touched("common/sd/", "scripts/check-sd-symbols.py"),
          }
          if ".github/workflows/quick.yml" in changed:
              suites = {key: True for key in suites}
          suites["submodules"] = any(suites[k] for k in
                                    ("toy", "physical", "granular", "looper", "reverb"))
          print("Changed files:", len(changed))
          print("Selected suites:", ", ".join(k for k, v in suites.items() if v))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, enabled in suites.items():
                  out.write(f"{key}={'true' if enabled else 'false'}\n")
          PY
      - name: Fetch pinned dependencies for instrument tests
        if: steps.changes.outputs.submodules == 'true'
        run: |
          git submodule update --init libDaisy DaisySP
          git -C libDaisy submodule update --init --recursive --jobs 4
      - name: Check release guards without API writes
        run: make test-release
      - name: Toy Piano host tests
        if: steps.changes.outputs.toy == 'true'
        run: make PROJECT=toy-piano test
      - name: Physical Modeling host tests (base and MOD)
        if: steps.changes.outputs.physical == 'true'
        run: make PROJECT=physical-modeling test
      - name: Nebulae host tests
        if: steps.changes.outputs.granular == 'true'
        run: make PROJECT=granular test
      - name: Looper host tests
        if: steps.changes.outputs.looper == 'true'
        run: make PROJECT=looper test
      - name: Reverb host tests
        if: steps.changes.outputs.reverb == 'true'
        run: make PROJECT=reverb-fx test
      - name: Mod on Daisy host tests
        if: steps.changes.outputs.mod == 'true'
        run: make -C modules/mod-on-daisy test
      - name: Editor core tests (without JUCE)
        if: steps.changes.outputs.editor == 'true'
        run: make -C editors/mod-on-daisy test
      - name: Diagnostics host tests
        if: steps.changes.outputs.diagnostics == 'true'
        run: make -C diagnostics/firmware test
      - name: Shared SD driver host tests (FAT32/exFAT images)
        if: steps.changes.outputs.sd == 'true'
        run: make -C common/sd test
