name: Firmware
# Full ARM builds are deliberately opt-in to preserve the GitHub Free Actions quota.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Choose one firmware (all is substantially more expensive)"
        required: true
        type: choice
        default: physical-modeling-mod
        options:
          - physical-modeling-mod
          - physical-modeling-fx-torus
          - physical-modeling-fx-ambient
          - physical-modeling
          - toy-piano
          - toy-piano-ambient
          - granular
          - looper
          - reverb-fx
          - mod-bench
          - all
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}-${{ inputs.project }}
  cancel-in-progress: true
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        env:
          SELECTED_PROJECT: ${{ inputs.project }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          projects = [
              {"project":"toy-piano","directory":"instruments/toy-piano","image":"ToyPiano","build":"build"},
              {"project":"toy-piano-ambient","directory":"instruments/toy-piano","image":"ToyPianoAmbient","build":"build/ambient"},
              {"project":"reverb-fx","directory":"effects/reverb","image":"AmbientReverb","build":"build"},
              {"project":"physical-modeling","directory":"instruments/physical-modeling","image":"PhysicalModeling","build":"build"},
              {"project":"physical-modeling-mod","directory":"instruments/physical-modeling","image":"PhysicalModelingMod","build":"build/mod"},
              {"project":"physical-modeling-fx-torus","directory":"instruments/physical-modeling","image":"PhysicalModelingFxTorus","build":"build/fx-torus"},
              {"project":"physical-modeling-fx-ambient","directory":"instruments/physical-modeling","image":"PhysicalModelingFxAmbient","build":"build/fx-ambient"},
              {"project":"granular","directory":"instruments/granular","image":"NebulaeOnDaisy","build":"build"},
              {"project":"looper","directory":"instruments/looper","image":"Looper","build":"build"},
              {"project":"mod-bench","directory":"modules/mod-on-daisy/bench","image":"ModBench","build":"build"},
          ]
          selected = os.environ["SELECTED_PROJECT"]
          targets = projects if selected == "all" else [p for p in projects if p["project"] == selected]
          if not targets:
              raise SystemExit(f"Unknown project: {selected}")
          print("targets=" + json.dumps(targets, separators=(",", ":")))
          PY
  build:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: |
          git submodule update --init libDaisy DaisySP
          git -C libDaisy submodule update --init --recursive --jobs 4
      - name: Install pinned ARM toolchain
        run: |
          bash scripts/install-toolchain.sh
          echo "$GITHUB_WORKSPACE/.tools/xpack-arm-none-eabi-gcc-13.2.1-1.1/bin" >> "$GITHUB_PATH"
      - name: Test release preflight
        run: make test-release
      - name: Test DSP on host
        run: make PROJECT=${{ matrix.project }} test
      - name: Test DSP and callback with ASan and UBSan
        run: make PROJECT=${{ matrix.project }} test-sanitize
      - name: Test lock-free MIDI queues with ThreadSanitizer
        if: matrix.project == 'toy-piano' || matrix.project == 'physical-modeling' || matrix.project == 'granular' || matrix.project == 'mod-bench'
        run: make PROJECT=${{ matrix.project }} test-thread
      - name: Cross-compile firmware
        run: make PROJECT=${{ matrix.project }} -j4
      - name: Read version
        id: version
        run: echo "value=$(make -s PROJECT=${{ matrix.project }} version)" >> "$GITHUB_OUTPUT"
      - name: Check firmware image
        run: python3 scripts/check-firmware.py ${{ matrix.directory }}/${{ matrix.build }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.bin
      - name: Check ARM ELF and static memory reserves
        if: startsWith(matrix.project, 'physical-modeling') || matrix.project == 'toy-piano-ambient'
        run: python3 scripts/check-physical-elf.py ${{ matrix.directory }}/${{ matrix.build }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.elf
      - name: Check Nebulae ARM memory, SD DMA and dynamic WAV capacities
        if: matrix.project == 'granular'
        run: python3 scripts/check-granular-elf.py ${{ matrix.directory }}/${{ matrix.build }}/NebulaeOnDaisy-v${{ steps.version.outputs.value }}.elf --host-test
      - name: Build Mod on Daisy bench variants (block 256, 64 active cells)
        if: matrix.project == 'mod-bench'
        run: |
          make -C modules/mod-on-daisy/bench BLOCK=256 -j4
          make -C modules/mod-on-daisy/bench MAX_ACTIVE=64 -j4
      - name: Record versioned firmware composition
        run: make PROJECT=${{ matrix.project }} manifest
      - name: Generate checksum
        run: cd ${{ matrix.directory }}/${{ matrix.build }} && sha256sum ${{ matrix.image }}-v${{ steps.version.outputs.value }}.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: ${{ matrix.project }}-v${{ steps.version.outputs.value }}-${{ github.sha }}
          path: |
            ${{ matrix.directory }}/${{ matrix.build }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.bin
            ${{ matrix.directory }}/${{ matrix.build }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.elf
            ${{ matrix.directory }}/${{ matrix.build }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.map
            ${{ matrix.directory }}/${{ matrix.build }}/SHA256SUMS
            ${{ matrix.directory }}/${{ matrix.build }}/COMPONENTS.json
          if-no-files-found: error
