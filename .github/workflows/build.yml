name: Firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: |
          git submodule update --init libDaisy DaisySP
          git -C libDaisy submodule update --init --recursive --jobs 4
      - name: Install pinned ARM toolchain
        run: |
          bash scripts/install-toolchain.sh
          echo "$GITHUB_WORKSPACE/.tools/xpack-arm-none-eabi-gcc-13.2.1-1.1/bin" >> "$GITHUB_PATH"
      - name: Test release preflight
        run: make test-release
      - name: Test DSP on host
        run: make test
      - name: Test DSP and callback with ASan and UBSan
        run: make test-sanitize
      - name: Test lock-free MIDI queues with ThreadSanitizer
        run: make test-thread
      - name: Cross-compile firmware
        run: make -j4
      - name: Read version
        id: version
        run: echo "value=$(make -s version)" >> "$GITHUB_OUTPUT"
      - name: Check firmware image
        run: python3 scripts/check-firmware.py
      - name: Generate checksum
        run: cd build && sha256sum ToyPiano-v${{ steps.version.outputs.value }}.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ToyPiano-v${{ steps.version.outputs.value }}-${{ github.sha }}
          path: |
            build/ToyPiano-v${{ steps.version.outputs.value }}.bin
            build/ToyPiano-v${{ steps.version.outputs.value }}.elf
            build/SHA256SUMS
          if-no-files-found: error
