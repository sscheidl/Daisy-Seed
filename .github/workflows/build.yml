name: Firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sd-driver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned libDaisy (HAL headers)
        run: |
          git submodule update --init libDaisy
          git -C libDaisy submodule update --init --recursive --jobs 4
      - name: Install pinned ARM toolchain
        run: |
          bash scripts/install-toolchain.sh
          echo "$GITHUB_WORKSPACE/.tools/xpack-arm-none-eabi-gcc-13.2.1-1.1/bin" >> "$GITHUB_PATH"
      - name: Test shared SD driver on FAT32/exFAT images
        run: make -C common/sd test
      - name: Test shared SD driver with ASan and UBSan
        run: make -C common/sd test-sanitize
      - name: Cross-compile and check SD symbol policy
        run: make -C common/sd arm-check
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - project: toy-piano
            directory: instruments/toy-piano
            image: ToyPiano
          - project: reverb-fx
            directory: effects/reverb
            image: AmbientReverb
          - project: physical-modeling
            directory: instruments/physical-modeling
            image: PhysicalModeling
          - project: physical-modeling-mod
            directory: instruments/physical-modeling
            build: build/mod
            image: PhysicalModelingMod
          - project: granular
            directory: instruments/granular
            image: NebulaeOnDaisy
          - project: looper
            directory: instruments/looper
            image: Looper
          - project: mod-bench
            directory: modules/mod-on-daisy/bench
            image: ModBench
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: |
          git submodule update --init libDaisy DaisySP
          git -C libDaisy submodule update --init --recursive --jobs 4
      - name: Install pinned ARM toolchain
        run: |
          bash scripts/install-toolchain.sh
          echo "$GITHUB_WORKSPACE/.tools/xpack-arm-none-eabi-gcc-13.2.1-1.1/bin" >> "$GITHUB_PATH"
      - name: Test release preflight
        run: make test-release
      - name: Test DSP on host
        run: make PROJECT=${{ matrix.project }} test
      - name: Test DSP and callback with ASan and UBSan
        run: make PROJECT=${{ matrix.project }} test-sanitize
      - name: Test lock-free MIDI queues with ThreadSanitizer
        if: matrix.project == 'toy-piano' || matrix.project == 'physical-modeling' || matrix.project == 'granular' || matrix.project == 'mod-bench'
        run: make PROJECT=${{ matrix.project }} test-thread
      - name: Cross-compile firmware
        run: make PROJECT=${{ matrix.project }} -j4
      - name: Check complete project catalogue
        if: matrix.project == 'physical-modeling'
        run: |
          make all-projects
          make test-projects
      - name: Read version
        id: version
        run: echo "value=$(make -s PROJECT=${{ matrix.project }} version)" >> "$GITHUB_OUTPUT"
      - name: Check firmware image
        run: python3 scripts/check-firmware.py ${{ matrix.directory }}/${{ matrix.build || 'build' }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.bin
      - name: Check ARM ELF and static memory reserves
        if: matrix.project == 'physical-modeling' || matrix.project == 'physical-modeling-mod'
        run: python3 scripts/check-physical-elf.py ${{ matrix.directory }}/${{ matrix.build || 'build' }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.elf
      - name: Check Nebulae ARM memory, SD DMA and dynamic WAV capacities
        if: matrix.project == 'granular'
        run: python3 scripts/check-granular-elf.py ${{ matrix.directory }}/${{ matrix.build || 'build' }}/NebulaeOnDaisy-v${{ steps.version.outputs.value }}.elf --host-test
      - name: Build Mod on Daisy bench variants (block 256, 64 active cells)
        if: matrix.project == 'mod-bench'
        run: |
          make -C modules/mod-on-daisy/bench BLOCK=256 -j4
          make -C modules/mod-on-daisy/bench MAX_ACTIVE=64 -j4
      - name: Generate checksum
        run: cd ${{ matrix.directory }}/${{ matrix.build || 'build' }} && sha256sum ${{ matrix.image }}-v${{ steps.version.outputs.value }}.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-v${{ steps.version.outputs.value }}-${{ github.sha }}
          path: |
            ${{ matrix.directory }}/${{ matrix.build || 'build' }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.bin
            ${{ matrix.directory }}/${{ matrix.build || 'build' }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.elf
            ${{ matrix.directory }}/${{ matrix.build || 'build' }}/${{ matrix.image }}-v${{ steps.version.outputs.value }}.map
            ${{ matrix.directory }}/${{ matrix.build || 'build' }}/SHA256SUMS
          if-no-files-found: error
